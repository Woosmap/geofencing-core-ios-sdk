name: Publish Geofencing Core release

on:
  push:
    branches:
      - main
    paths:
      - WoosmapGeofencingCore.xcodeproj/project.pbxproj

permissions:
  contents: write

jobs:
  pre-publish:
    runs-on: ubuntu-latest
    outputs:
      sdk_version: ${{ steps.extract_version.outputs.sdk_version }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6.1.0

      - name: Fetch SDK version from Podspec
        id: extract_version
        run: |
          SDK_VERSION=$(sed -n "s/.*s.version *= *'\([^']*\)'.*/\1/p" WoosmapGeofencingCore.podspec)
          echo "SDK version: $SDK_VERSION"
          echo "sdk_version=$SDK_VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.extract_version.outputs.sdk_version }}
          git push origin ${{ steps.extract_version.outputs.sdk_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.extract_version.outputs.sdk_version }}
          body_path: WHATSNEW.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-podspec:
    runs-on: macos-15
    needs: pre-publish

    steps:
      - name: Set up Ruby and CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Checkout default branch
        uses: actions/checkout@v6.1.0

      # CocoaPods trunk is read-only from 2 December 2026, so nothing is pushed there.
      # Pods resolve this repo by Git tag. `pod spec lint` fetches s.source at the tag
      # pre-publish just pushed, so it checks that path rather than this checkout.
      - name: Lint podspec from its Git tag
        run: |
          pod spec lint WoosmapGeofencingCore.podspec --allow-warnings